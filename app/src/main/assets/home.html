<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ProxyBrowser · 主页</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #1a1a1a;
    -webkit-text-size-adjust: 100%;
  }
  body { padding: 24px 20px 32px; }
  .brand {
    display: flex; align-items: center;
    margin-top: 36px; margin-bottom: 28px;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: #3B82F6;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 18px;
  }
  .brand h1 {
    margin: 0 0 0 10px; font-size: 18px; font-weight: 600;
  }
  .brand small { display: block; font-size: 11px; color: #9ca3af; margin-top: 2px; font-weight: normal; }
  .search {
    width: 100%;
    display: flex; align-items: center;
    height: 48px; padding: 0 14px;
    background: #f7f8fa; border-radius: 24px;
    border: 1px solid transparent;
    transition: border-color .15s;
  }
  .search:focus-within { border-color: #3B82F6; background: #fff; }
  .search input {
    flex: 1; height: 100%;
    border: 0; outline: 0; background: transparent;
    font-size: 15px; color: #1a1a1a;
  }
  .search input::placeholder { color: #9ca3af; }
  .search svg { width: 20px; height: 20px; color: #6b7280; margin-right: 8px; }

  .subtitle {
    margin-top: 32px; margin-bottom: 14px;
    font-size: 11px; color: #9ca3af;
    text-transform: uppercase; letter-spacing: 1px;
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .tile {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    transition: transform .1s, background .1s;
  }
  .tile:active { background: #f7f8fa; transform: scale(.97); }
  .tile .icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 16px;
    margin-bottom: 6px;
  }
  .tile .name { font-size: 11px; color: #4b5563; text-align: center; }

  .status {
    margin-top: 32px; padding: 14px 16px;
    background: #f7f8fa; border-radius: 10px;
    font-size: 12px; color: #6b7280;
    line-height: 1.6;
  }
  .status strong { color: #1a1a1a; font-weight: 600; }

  .proxy-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .proxy-status.on  { background: #10B981; }
  .proxy-status.off { background: #EF4444; }
</style>
</head>
<body>
<div class="brand">
  <div class="logo">P</div>
  <div>
    <h1>ProxyBrowser</h1>
    <small>轻量代理浏览器</small>
  </div>
</div>

<form class="search" id="searchForm" onsubmit="return submitSearch(event)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <input id="q" type="text" placeholder="搜索或输入网址" autofocus />
</form>

<div class="subtitle">常用入口</div>
<div class="grid">
  <div class="tile" onclick="go('https://www.youtube.com')">
    <div class="icon" style="background:#FF0000">▶</div>
    <div class="name">YouTube</div>
  </div>
  <div class="tile" onclick="go('https://x.com')">
    <div class="icon" style="background:#000">𝕏</div>
    <div class="name">X (Twitter)</div>
  </div>
  <div class="tile" onclick="go('https://web.telegram.org')">
    <div class="icon" style="background:#0088CC">✈</div>
    <div class="name">Telegram</div>
  </div>
  <div class="tile" onclick="go('https://github.com')">
    <div class="icon" style="background:#24292e">G</div>
    <div class="name">GitHub</div>
  </div>
  <div class="tile" onclick="go('https://www.google.com')">
    <div class="icon" style="background:#4285F4">G</div>
    <div class="name">Google</div>
  </div>
  <div class="tile" onclick="go('https://www.wikipedia.org')">
    <div class="icon" style="background:#000">W</div>
    <div class="name">Wikipedia</div>
  </div>
  <div class="tile" onclick="go('https://www.bing.com')">
    <div class="icon" style="background:#008373">B</div>
    <div class="name">Bing</div>
  </div>
  <div class="tile" onclick="go('https://duckduckgo.com')">
    <div class="icon" style="background:#DE5833">D</div>
    <div class="name">DuckDuckGo</div>
  </div>
</div>

<div class="status" id="statusBox">
  <span class="proxy-status off" id="proxyDot"></span>
  <strong id="proxyLabel">代理未启动</strong><br/>
  <span id="proxyDetail">请先在「节点」页面选择/添加代理节点</span>
</div>

<script>
  // 搜索 or 直跳
  function submitSearch(e){
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (!q) return false;
    if (/^https?:\/\//i.test(q) || /^[a-z0-9-]+\.[a-z]{2,}/i.test(q)) {
      if (!/^https?:\/\//i.test(q)) q = 'https://' + q;
      window.location.href = q;
    } else {
      window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    }
    return false;
  }
  function go(url) { window.location.href = url; }

  // 拉一次状态（通过 JS Bridge）
  if (window.__pb_status) window.__pb_status();
</script>
</body>
</html>
